<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="springGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="dbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bgGrad)" rx="12"/>
  <rect x="20" y="20" width="760" height="410" fill="none" stroke="#1e293b" stroke-width="1.5" rx="8" stroke-dasharray="4 4"/>
  
  <!-- Title Badge -->
  <rect x="50" y="45" width="120" height="30" rx="6" fill="#1e293b"/>
  <text x="110" y="65" fill="#10b981" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">SPRING BOOT 3.4</text>
  
  <text x="50" y="115" fill="#f8fafc" font-family="sans-serif" font-size="28" font-weight="bold">ZenCart Enterprise Architecture</text>
  <text x="50" y="145" fill="#94a3b8" font-family="sans-serif" font-size="14">Layered Domain, Security Filter Chains &amp; Relational Persistence</text>
  
  <!-- Architectural Nodes -->
  <!-- Layer 1: Client / Web -->
  <g transform="translate(60, 190)">
    <rect width="180" height="180" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect x="15" y="15" width="150" height="32" rx="4" fill="#0f172a"/>
    <text x="90" y="36" fill="#f8fafc" font-family="sans-serif" font-size="13" font-weight="600" text-anchor="middle">Controller Layer</text>
    <text x="25" y="80" fill="#94a3b8" font-family="monospace" font-size="12">• /api/auth/**</text>
    <text x="25" y="105" fill="#94a3b8" font-family="monospace" font-size="12">• /api/products</text>
    <text x="25" y="130" fill="#94a3b8" font-family="monospace" font-size="12">• /api/orders</text>
    <text x="25" y="155" fill="#10b981" font-family="monospace" font-size="11">Validation (@Valid)</text>
  </g>
  
  <!-- Arrow 1 -->
  <path d="M 240 280 L 300 280" stroke="#10b981" stroke-width="2" stroke-dasharray="6 4"/>
  <polygon points="300,276 310,280 300,284" fill="#10b981"/>
  
  <!-- Layer 2: Service & Security -->
  <g transform="translate(310, 190)">
    <rect width="180" height="180" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <rect x="15" y="15" width="150" height="32" rx="4" fill="url(#springGrad)"/>
    <text x="90" y="36" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Security &amp; Domain</text>
    <text x="25" y="80" fill="#f8fafc" font-family="sans-serif" font-size="12">Spring Security</text>
    <text x="25" y="105" fill="#94a3b8" font-family="monospace" font-size="12">SecurityFilterChain</text>
    <text x="25" y="130" fill="#94a3b8" font-family="sans-serif" font-size="12">Transactional Logic</text>
    <text x="25" y="155" fill="#10b981" font-family="monospace" font-size="11">Lombok Entities</text>
  </g>
  
  <!-- Arrow 2 -->
  <path d="M 490 280 L 550 280" stroke="#3b82f6" stroke-width="2" stroke-dasharray="6 4"/>
  <polygon points="550,276 560,280 550,284" fill="#3b82f6"/>
  
  <!-- Layer 3: Persistence -->
  <g transform="translate(560, 190)">
    <rect width="180" height="180" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
    <rect x="15" y="15" width="150" height="32" rx="4" fill="url(#dbGrad)"/>
    <text x="90" y="36" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Data JPA &amp; DB</text>
    <text x="25" y="80" fill="#f8fafc" font-family="sans-serif" font-size="12">JpaRepository</text>
    <text x="25" y="105" fill="#94a3b8" font-family="monospace" font-size="12">Hibernate ORM</text>
    <text x="25" y="130" fill="#94a3b8" font-family="sans-serif" font-size="12">MySQL Engine</text>
    <text x="25" y="155" fill="#60a5fa" font-family="monospace" font-size="11">Logical Schema</text>
  </g>
</svg>
