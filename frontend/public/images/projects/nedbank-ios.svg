<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="iosBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#021c15"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#065f46"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#iosBg)" rx="12"/>
  <rect x="20" y="20" width="760" height="410" fill="none" stroke="#047857" stroke-width="1.5" rx="8"/>
  
  <rect x="50" y="45" width="140" height="30" rx="6" fill="#065f46"/>
  <text x="120" y="65" fill="#6ee7b7" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">SWIFT / IOS</text>
  
  <text x="50" y="115" fill="#f0fdf4" font-family="sans-serif" font-size="28" font-weight="bold">Nedbank Mobile Clone</text>
  <text x="50" y="145" fill="#a7f3d0" font-family="sans-serif" font-size="14">Native iOS Financial Banking Application • Xcode &amp; Apple HIG</text>
  
  <!-- Mobile Device Silhouette Mockup -->
  <g transform="translate(100, 180)">
    <!-- Device Frame -->
    <rect width="600" height="210" rx="14" fill="#022c22" stroke="#10b981" stroke-width="1.5"/>
    
    <!-- Virtual Credit Card -->
    <rect x="40" y="30" width="260" height="150" rx="10" fill="url(#cardGrad)" stroke="#34d399" stroke-width="1"/>
    <text x="65" y="65" fill="#ecfdf5" font-family="sans-serif" font-size="16" font-weight="bold">Private Wealth</text>
    <circle cx="260" cy="60" r="14" fill="#10b981" opacity="0.6"/>
    <circle cx="275" cy="60" r="14" fill="#34d399" opacity="0.6"/>
    <text x="65" y="125" fill="#a7f3d0" font-family="monospace" font-size="14">•••• •••• •••• 8842</text>
    <text x="65" y="155" fill="#ecfdf5" font-family="sans-serif" font-size="12">KARABO R KHUNOU</text>
    
    <!-- Account Specs on the right -->
    <g transform="translate(340, 40)">
      <text x="0" y="20" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="bold">Native iOS Highlights</text>
      <text x="0" y="50" fill="#a7f3d0" font-family="monospace" font-size="12">• Native Navigation Controller</text>
      <text x="0" y="75" fill="#a7f3d0" font-family="monospace" font-size="12">• Auto Layout Constraints</text>
      <text x="0" y="100" fill="#a7f3d0" font-family="monospace" font-size="12">• HIG-compliant Component Hierarchy</text>
      <text x="0" y="125" fill="#6ee7b7" font-family="monospace" font-size="11">Built in Xcode with Swift</text>
    </g>
  </g>
</svg>
