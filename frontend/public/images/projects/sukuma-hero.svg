<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="sukumaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#042f2e"/>
      <stop offset="100%" stop-color="#021414"/>
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#sukumaBg)" rx="12"/>
  <rect x="20" y="20" width="760" height="410" fill="none" stroke="#134e4a" stroke-width="1.5" rx="8"/>
  
  <rect x="50" y="45" width="130" height="30" rx="6" fill="#134e4a"/>
  <text x="115" y="65" fill="#2dd4bf" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">ANGULAR 20</text>
  
  <text x="50" y="115" fill="#f0fdfa" font-family="sans-serif" font-size="28" font-weight="bold">sukuma Fleet Services</text>
  <text x="50" y="145" fill="#99f6e4" font-family="sans-serif" font-size="14">Dynamic Transport &amp; Fleet Management Platform • East Rand, Gauteng</text>
  
  <!-- Showcase Card / Mockup Area -->
  <g transform="translate(60, 180)">
    <rect width="680" height="210" rx="10" fill="#0f172a" stroke="#14b8a6" stroke-width="1.5"/>
    <!-- Mock Header -->
    <rect width="680" height="40" rx="10" fill="#1e293b"/>
    <circle cx="25" cy="20" r="5" fill="#ef4444"/>
    <circle cx="42" cy="20" r="5" fill="#f59e0b"/>
    <circle cx="59" cy="20" r="5" fill="#10b981"/>
    <text x="340" y="25" fill="#94a3b8" font-family="monospace" font-size="12" text-anchor="middle">sukuma-fleet.service • Standalone Component Architecture</text>
    
    <!-- Hero Mock Content -->
    <g transform="translate(40, 60)">
      <rect width="60" height="60" rx="30" fill="url(#tealGrad)"/>
      <!-- Truck Icon Path -->
      <path d="M 18 35 L 22 25 L 35 25 L 35 38 L 18 38 Z M 35 28 L 44 28 L 47 34 L 47 38 L 35 38 Z" fill="#ffffff"/>
      <circle cx="25" cy="40" r="3" fill="#0f172a"/>
      <circle cx="42" cy="40" r="3" fill="#0f172a"/>
      
      <text x="80" y="30" fill="#ffffff" font-family="sans-serif" font-size="18" font-weight="bold">Fueling Growth. Transporting with Purpose.</text>
      <text x="80" y="55" fill="#94a3b8" font-family="sans-serif" font-size="13">Modular Fleet Services, Route Logistics &amp; Dynamic Tracking</text>
      
      <!-- Metrics Pills -->
      <rect x="80" y="75" width="130" height="26" rx="4" fill="#1e293b"/>
      <text x="145" y="92" fill="#2dd4bf" font-family="sans-serif" font-size="11" text-anchor="middle">CSS3 Keyframes</text>
      
      <rect x="220" y="75" width="150" height="26" rx="4" fill="#1e293b"/>
      <text x="295" y="92" fill="#2dd4bf" font-family="sans-serif" font-size="11" text-anchor="middle">Zero NgModule Overhead</text>
    </g>
  </g>
</svg>
