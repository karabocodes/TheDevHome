<div class="min-h-screen flex flex-col bg-surface-950 text-slate-100 font-sans">
  <!-- Global Navigation Header -->
  <header class="sticky top-0 z-30 w-full border-b border-surface-800/80 bg-surface-950/80 backdrop-blur-md">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <!-- Brand Logo -->
      <a routerLink="/" class="flex items-center gap-2.5 group focus:outline-none focus:ring-2 focus:ring-brand-500 rounded-lg p-1">
        <div class="w-8 h-8 rounded-lg bg-surface-900 border border-surface-700 flex items-center justify-center font-mono font-bold text-brand-400 group-hover:border-brand-500 transition-colors">
          K
        </div>
        <div class="flex flex-col">
          <span class="text-sm font-bold tracking-tight text-white group-hover:text-brand-300 transition-colors">
            Karabo Khunou
          </span>
          <span class="text-[10px] font-mono text-surface-400">
            TheDevHome &bull; Portfolio
          </span>
        </div>
      </a>

      <!-- Navigation Links -->
      <nav class="flex items-center gap-4 text-sm font-mono" aria-label="Main Navigation">
        <a
          routerLink="/"
          routerLinkActive="text-brand-400"
          [routerLinkActiveOptions]="{ exact: true }"
          class="text-surface-300 hover:text-white transition-colors focus:outline-none focus:underline"
        >
          Projects
        </a>
        <a
          href="https://github.com/karabocodes"
          target="_blank"
          rel="noopener noreferrer"
          class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-surface-900 hover:bg-surface-800 text-surface-200 hover:text-white border border-surface-800 transition-colors focus:ring-2 focus:ring-brand-500"
        >
          <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24">
            <path fill-rule="evenodd" clip-rule="evenodd" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.53 1.032 1.53 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z"/>
          </svg>
          <span class="hidden sm:inline">GitHub</span>
        </a>
      </nav>
    </div>
  </header>

  <!-- Routed View Outlet -->
  <div class="flex-1">
    <router-outlet></router-outlet>
  </div>

  <!-- Global Footer -->
  <footer class="border-t border-surface-800 bg-surface-950 py-8 text-surface-400 text-xs font-mono">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col sm:flex-row items-center justify-between gap-4">
      <p>
        &copy; 2026 Karabo Khunou. Built with Angular 20 Standalone, Tailwind CSS &amp; Python FastAPI.
      </p>
      <div class="flex items-center gap-4">
        <a href="https://github.com/karabocodes/TheDevHome" target="_blank" rel="noopener noreferrer" class="hover:text-white transition-colors">
          Repository Source
        </a>
        <span>&bull;</span>
        <span class="text-brand-400">Production-Ready Architecture</span>
      </div>
    </div>
  </footer>

  <!-- Persistent Route-Aware Chatbot Component -->
  <app-chatbot></app-chatbot>
</div>
